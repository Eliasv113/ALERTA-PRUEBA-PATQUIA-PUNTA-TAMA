name: Alertas meteorologicas del SMN

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alertas-smn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnosticar versión y configuración
        run: |
          set -eu
          echo "======================================"
          echo " DIAGNÓSTICO DEL SISTEMA DE ALERTAS"
          echo "======================================"
          echo "Repositorio: ${GITHUB_REPOSITORY}"
          echo "Rama/ref: ${GITHUB_REF}"
          echo "Commit ejecutado: ${GITHUB_SHA}"
          git log -1 --oneline

          echo ""
          echo "=== ARCHIVO DE EJECUCIÓN ==="
          pwd
          ls -la main.py
          sha256sum main.py

          echo ""
          echo "=== LOCALIDADES CONFIGURADAS ==="
          grep -n -A25 '^LOCALIDADES_PERMITIDAS' main.py || true
          grep -n -A12 '^LOCALIDADES =' main.py || true

          echo ""

          echo ""
          echo "=== WORKFLOWS DISPONIBLES ==="
          find .github/workflows -maxdepth 1 -type f -print | sort

          echo ""
          echo "=== REFERENCIAS A EJECUCIONES PYTHON EN WORKFLOWS ==="
          grep -RniE 'python(3)? .*\.py|main\.py|alerta_prueba' .github/workflows || true

      - name: Consultar el SMN y enviar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -u main.py

      - name: Guardar historial
        if: always()
        run: |
          if [ ! -f historial_alertas.json ]; then
            echo "No existe historial_alertas.json; no hay historial para guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historial_alertas.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de alertas"
            git push
          else
            echo "No hay cambios en el historial."
          fi
