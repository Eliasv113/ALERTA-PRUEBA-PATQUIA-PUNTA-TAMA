name: Alertas meteorologicas del SMN

on:
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/alertas.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita cancelar una consulta que ya está procesando alertas.
# Si una ejecución se extiende, la siguiente queda pendiente en lugar de
# interrumpir el envío en curso.
concurrency:
  group: alertas-smn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Preparar OCR (Tesseract)
        run: |
          set -eu
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
          fi
          tesseract --version | head -n 1 || true

      - name: Instalar dependencias Python
        run: |
          set -eu
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Diagnosticar versión y configuración
        run: |
          set -eu
          echo "======================================"
          echo " DIAGNÓSTICO DEL SISTEMA DE ALERTAS"
          echo "======================================"
          echo "Repositorio: ${GITHUB_REPOSITORY}"
          echo "Rama/ref: ${GITHUB_REF}"
          echo "Commit ejecutado: ${GITHUB_SHA}"
          echo "Inicio del job UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git log -1 --oneline

          echo ""
          echo "=== ARCHIVO DE EJECUCIÓN ==="
          pwd
          ls -la main.py
          sha256sum main.py
          python --version

          echo ""
          echo "=== LOCALIDADES CONFIGURADAS ==="
          grep -n -A25 '^LOCALIDADES_PERMITIDAS' main.py || true
          grep -n -A12 '^LOCALIDADES =' main.py || true

          echo ""
          echo "=== WORKFLOWS DISPONIBLES ==="
          find .github/workflows -maxdepth 1 -type f -print | sort

      - name: Consultar CAP + GeoRSS y enviar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u main.py

      - name: Guardar historial
        if: always()
        run: |
          set -eu
          if [ ! -f historial_alertas.json ]; then
            echo "No existe historial_alertas.json; no hay historial para guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historial_alertas.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de alertas"
            git push
          else
            echo "No hay cambios en el historial."
          fi
