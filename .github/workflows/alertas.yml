
name: Alertas meteorologicas del SMN

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnosticar configuración
        run: |
          echo "======================================"
          echo " DIAGNÓSTICO DEL SISTEMA DE ALERTAS"
          echo "======================================"

          echo ""
          echo "=== REPOSITORIO Y ARCHIVO DE EJECUCIÓN ==="
          pwd
          ls -la main.py

          echo ""
          echo "=== APARICIONES DE BARILOCHE ==="
          grep -Rni "Bariloche" . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            || true

          echo ""
          echo "=== CONFIGURACIÓN LOCALIDADES EN main.py ==="
          grep -n -A20 '^LOCALIDADES' main.py || true

          echo ""
          echo "=== WORKFLOWS DISPONIBLES ==="
          find .github/workflows -maxdepth 1 -type f -print

      - name: Consultar el SMN y enviar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -u main.py

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historial_alertas.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de alertas"
            git push
          else
            echo "No hay cambios en el historial."
          fi
