name: ALERTA PRUEBA POLYGON

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Ejecutar el script
        run: python alerta_prueba_polygon.py 

      - name: Guardar el historial de alertas
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add historial_alerta_prueba_polygon.json
          git commit -m "Actualizar historial PRUEBA POLYGON" || echo "No hay alertas nuevas"
          git push
