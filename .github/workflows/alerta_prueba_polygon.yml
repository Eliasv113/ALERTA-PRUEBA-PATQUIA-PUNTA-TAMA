
name: ALERTA PRUEBA POLYGON

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerta_prueba_polygon
  cancel-in-progress: false

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Ejecutar el script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python alerta_prueba_polygon.py

      - name: Guardar el historial de alertas
        run: |
          git add historial_alerta_prueba_polygon.json

          if git diff --cached --quiet; then
            echo "No hay alertas nuevas."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar historial PRUEBA POLYGON"
          git push
